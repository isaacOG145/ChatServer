<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Entrar al Chat</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-md transition-all duration-300 hover:-translate-y-1">
        
        <div class="bg-gradient-to-r from-blue-600 to-purple-700 text-white text-center py-8 px-6">
            <div class="text-4xl mb-4">
                <i class="fas fa-comments"></i>
            </div>
            <h2 class="text-2xl font-semibold mb-2">Bienvenido al Chat</h2>
            <p class="opacity-90">Inicia sesión para continuar</p>
        </div>
        
        <div class="p-8">
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 flex items-center animate-fade-in">
                <i class="fas fa-exclamation-circle mr-3"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form method="POST" action="/">
               
                <div class="mb-6">
                    <label for="username" class="block text-gray-700 text-sm font-medium mb-2">
                        Nombre de usuario
                    </label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500">
                            <i class="fas fa-user"></i>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Mínimo 3 caracteres"
                            minlength="3"
                            required
                            autofocus
                            class="flex-1 min-w-0 rounded-r-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        >
                    </div>
                </div>
                
                <!-- Password -->
                <div class="mb-8">
                    <label for="password" class="block text-gray-700 text-sm font-medium mb-2">
                        Contraseña
                    </label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Mínimo 4 caracteres"
                            minlength="4"
                            required
                            class="flex-1 min-w-0 border-y border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="inline-flex items-center px-3 rounded-r-lg border border-l-0  border-gray-300 text-gray-500 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    name="traditional_login"
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-700 hover:from-blue-700 hover:to-purple-800 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Inicia sesión
                </button>
            </form>

            <form method="POST" action="/" class="mt-3">
                <button
                    type="submit"
                    name="google_login"
                    value="true"
                    class="w-full bg-white border border-gray-300 text-gray-700 font-medium py-3 px-4 rounded-lg transition-all duration-300 hover:shadow-md hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 flex items-center justify-center gap-3 hover:bg-gray-50"
                >
                    <img src="{{ url_for('static', filename='img/google.png') }}" alt="Google" class="w-5 h-5">
                    Inicia sesión con Google
                </button>
            </form>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/toggle.js') }}">
       
    </script>
</body>
</html>
