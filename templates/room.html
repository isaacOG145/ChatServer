<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0/jsencrypt.min.js"></script>
    <title>Chat Seguro</title>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-blue-600 to-purple-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold">Chat Seguro</h1>
                
                <span id="connectionStatus" class="px-3 py-1 rounded-lg text-sm bg-yellow-100 text-yellow-800">
                    <i class="fas fa-circle mr-1"></i> Conectando...
                </span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="font-medium">{{ username }}</span>
                <a href="{{ url_for('manual_signature') }}" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
    <i class="fas fa-signature mr-2"></i>Firma Digital
</a>
                <a href="{{ url_for('logout') }}" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Sala de Chat</h2>
            
            <div class="border border-gray-200 rounded-lg bg-gray-50 h-96 mb-4 overflow-y-auto p-4 flex flex-col space-y-3">
                <div id="chat" class="flex-1 flex flex-col space-y-3">
                  
                </div>
            </div>

            <div class="border border-gray-200 rounded-lg p-4 bg-white">
                <div class="flex items-center space-x-3">
                    
                    <input 
                        type="text" 
                        id="message" 
                        placeholder="Escribe tu mensaje..." 
                        autocomplete="off"
                        class="flex-1 border border-gray-300 rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >

                    <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-semibold transition-all duration-200 hover:shadow-lg transform hover:-translate-y-0.5">
                        <i class="fas fa-paper-plane mr-2"></i>Enviar
                    </button>
                </div>
                
                <div class="text-center text-gray-500 text-sm mt-3">
                    <i class="fas fa-info-circle mr-1"></i>
                    Todos los mensajes están cifrados de extremo a extremo
                </div>
            </div>
        </div>
    </main>

    <script>
        const username = "{{ username }}";
        const SOCKET_HOST = "{{ socket_host }}";
        const SOCKET_PORT = "{{ socket_port }}";
        const SOCKET_URL = SOCKET_HOST + ":" + SOCKET_PORT;
        const room = "general";

        let socket;
        let publicKey = "";

        const chatContainer = document.getElementById('chat');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const connectionStatus = document.getElementById('connectionStatus');

        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.className = 'px-3 py-1 rounded-lg text-sm bg-green-100 text-green-800';
                connectionStatus.innerHTML = '<i class="fas fa-circle mr-1"></i> Conectado';
            } else {
                connectionStatus.className = 'px-3 py-1 rounded-lg text-sm bg-red-100 text-red-800';
                connectionStatus.innerHTML = '<i class="fas fa-circle mr-1"></i> Desconectado';
            }
        }

        async function loadPublicKey() {
            try {
                const res = await fetch("/public_key");
                publicKey = await res.text();
                console.log("✓ Clave pública cargada");
            } catch (error) {
                console.error("✗ Error cargando la clave pública:", error);
            }
        }

        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function displayMessage(text, type = 'other') {
            const messageEl = document.createElement('div');
            
            if (type === 'system') {
                messageEl.className = 'text-center text-gray-500 italic text-sm';
                messageEl.textContent = text;
            } else {

                const colonIndex = text.indexOf(': ');
                if (colonIndex === -1) {
                  
                    messageEl.className = 'bg-white border border-gray-200 rounded-2xl rounded-bl-md p-4 max-w-[70%] self-start';
                    messageEl.textContent = text;
                } else {
                    const messageUsername = text.substring(0, colonIndex);
                    const messageContent = text.substring(colonIndex + 2);
                    
                    if (messageUsername === username) {
                        messageEl.className = 'bg-blue-600 text-white rounded-2xl rounded-br-md p-4 max-w-[70%] self-end';
                    } else {
                        messageEl.className = 'bg-purple-500 border text-white font-semibold border-gray-200 rounded-2xl rounded-bl-md p-4 max-w-[70%] self-start';
                    }
                    
                    const headerEl = document.createElement('div');
                    headerEl.className = 'flex justify-between text-xs mb-2 gap-1';
                    headerEl.innerHTML = `<span class="font-medium">${messageUsername}</span><span>${new Date().toLocaleTimeString()}</span>`;
                    
                    const contentEl = document.createElement('div');
                    contentEl.className = 'text-white font-semibold';
                    contentEl.textContent = messageContent;
                    
                    messageEl.appendChild(headerEl);
                    messageEl.appendChild(contentEl);
                }
            }
            
            chatContainer.appendChild(messageEl);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function initializeChat() {

            await loadPublicKey();
            
            socket = io(SOCKET_URL);
            
            socket.on('connect', () => {
                console.log("✓ Conectado al servidor");
                updateConnectionStatus(true);
                
                socket.emit("join", { username, room });
                displayMessage(`¡Bienvenido al chat, ${username}!`, 'system');
            });
            
            socket.on('message', (data) => {
                console.log("Mensaje recibido:", data);
                
                if (data.includes('se unió al chat') || data.includes('salió del chat')) {
                    displayMessage(data, 'system');
                } else {
                    displayMessage(data, 'other');
                }
            });
            
            socket.on('disconnect', () => {
                console.log("✗ Desconectado del servidor");
                updateConnectionStatus(false);
                displayMessage("⚠️ Desconectado del servidor. Intentando reconectar...", 'system');
            });
            
            socket.on('reconnect', () => {
                console.log("✓ Reconectado al servidor");
                updateConnectionStatus(true);
                displayMessage("✓ Reconectado al servidor", 'system');
                socket.emit("join", { username, room });
            });
        }

        async function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg || !socket) return;

            try {
                const hash = await sha256(msg);
                const payload = msg + "|HASH|" + hash;

                const encryptor = new JSEncrypt();
                encryptor.setPublicKey(publicKey);
                const encrypted = encryptor.encrypt(payload);

                if (!encrypted) {
                    alert("Error cifrando el mensaje.");
                    return;
                }

                socket.emit("message", {
                    username,
                    room,
                    msg: encrypted
                });

                messageInput.value = "";
                
            } catch (error) {
                console.error("Error enviando mensaje:", error);
                displayMessage("✗ Error al enviar el mensaje", 'system');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            initializeChat();
            messageInput.focus();
        });
    </script>
</body>
</html>
