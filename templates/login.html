<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar al Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3a0ca3;
      --accent-color: #4cc9f0;
      --light-color: #f8f9fa;
      --dark-color: #212529;
    }
    
    body {
      background: #E8E8E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .login-card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      transition: transform 0.3s ease;
    }
    
    .login-card:hover {
      transform: translateY(-5px);
    }
    
    .card-header {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      text-align: center;
      padding: 30px 20px;
    }
    
    .card-header h2 {
      margin: 0;
      font-weight: 600;
    }
    
    .card-body {
      padding: 30px;
    }
    
    .form-control {
      border-radius: 8px;
      padding: 12px 15px;
      border: 1px solid #e1e5ee;
      transition: all 0.3s;
    }
    
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
    }
    
    .input-group-text {
      background-color: white;
      border: 1px solid #e1e5ee;
      transition: all 0.3s;
    }
    
    .input-group:focus-within .input-group-text {
      border-color: var(--primary-color);
    }
    
    .btn-login {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border: none;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
      width: 100%;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
    }
    
    .btn-login:disabled {
      opacity: 0.7;
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
    }
    
    .logo {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: white;
    }
    
    .password-toggle {
      cursor: pointer;
      color: #6c757d;
      transition: color 0.3s;
      border-left: none;
    }
    
    .password-toggle:hover {
      color: var(--primary-color);
    }
    
    .spinner-border {
      width: 1rem;
      height: 1rem;
    }
    
    .alert {
      border-radius: 8px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #1976d2;
      margin-top: 15px;
    }
    
    .info-box i {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <i class="fas fa-comments"></i>
      </div>
      <h2>Bienvenido al Chat</h2>
      <p class="mb-0">Inicia sesión para continuar</p>
    </div>
    <div class="card-body">
      {% if error %}
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}
      
      <form method="POST" action="/">
        <div class="mb-3">
          <label for="username" class="form-label">Nombre de usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input 
              type="text" 
              class="form-control" 
              id="username" 
              name="username" 
              placeholder="Mínimo 3 caracteres"
              minlength="3"
              required
              autofocus
            >
          </div>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              name="password" 
              placeholder="Mínimo 4 caracteres"
              minlength="4"
              required
            >
            <span class="input-group-text password-toggle" id="togglePassword" role="button" aria-label="Mostrar/ocultar contraseña" tabindex="0">
              <i class="fas fa-eye"></i>
            </span>
          </div>
        </div>
        
        <button type="submit" class="btn btn-login">
          <i class="fas fa-sign-in-alt me-2"></i>
          Iniciar Sesión
        </button>
        
        <div class="info-box">
          <i class="fas fa-info-circle"></i>
          <strong>Nuevo usuario:</strong> Si es tu primera vez, simplemente ingresa un nombre de usuario y contraseña. Tu cuenta se creará automáticamente.
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle para mostrar/ocultar contraseña
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    
    togglePassword.addEventListener('click', togglePasswordVisibility);
    togglePassword.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        togglePasswordVisibility();
      }
    });
    
    function togglePasswordVisibility() {
      const icon = togglePassword.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
        togglePassword.setAttribute('aria-label', 'Ocultar contraseña');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
        togglePassword.setAttribute('aria-label', 'Mostrar contraseña');
      }
    }
  </script>
</body>
</html>
