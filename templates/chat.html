<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chat RSA Asimétrico</title>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0/jsencrypt.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #1b1b1b;
      color: #f1f1f1;
    }
    #chat {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 10px;
      height: 300px;
      overflow-y: scroll;
      background: #2c2c2c;
      margin-bottom: 10px;
    }
    #message {
      width: 70%;
      padding: 6px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>🔐 Chat con Cifrado Asimétrico (RSA)</h2>

<div id="login">
  <label>Tu nombre:</label>
  <input type="text" id="username">
  <button id="joinBtn">Entrar al chat</button>
</div>

<div id="chat-container" style="display:none;">
  <div id="chat"></div>

  <input id="message" placeholder="Escribe tu mensaje..." autocomplete="off">
  <button id="sendBtn">Enviar</button>
</div>

<script>
  const socket = io();
  const room = "general";
  let username = "";
  let publicKey = "";

  // Obtener la clave pública del servidor
  async function loadPublicKey() {
    const res = await fetch("/public_key");
    publicKey = await res.text();
  }

  document.getElementById("joinBtn").addEventListener("click", () => {
    username = document.getElementById("username").value.trim();
    if (!username) return alert("Ingresa tu nombre.");

    document.getElementById("login").style.display = "none";
    document.getElementById("chat-container").style.display = "block";

    socket.emit("join", { username, room });
  });

  document.getElementById("sendBtn").addEventListener("click", async () => {
    const msg = document.getElementById("message").value.trim();
    if (!msg) return;

    const encryptor = new JSEncrypt();
    encryptor.setPublicKey(publicKey);

    const encrypted = encryptor.encrypt(msg);

    if (!encrypted) {
      alert("Error cifrando mensaje.");
      return;
    }

    socket.emit("message", {
      username,
      room,
      msg: encrypted
    });

    document.getElementById("message").value = "";
  });

  socket.on("message", (data) => {
    const chat = document.getElementById("chat");
    const el = document.createElement("div");
    el.textContent = data;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  });

  window.onload = loadPublicKey;
</script>
</body>
</html>
